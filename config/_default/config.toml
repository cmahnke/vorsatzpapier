[params]
  keywords = "Vorsatzpapiere, Ornamente, Papier, Bücher, Book end paper, paper, books"
  copyrightYears = "MMXXI - MMXXVI"
  cc = true
  stylesheets = []
  productionIIIFURLPrefix="https://static.projektemacher.org/vorsatzpapier/"
  pdfDownload = true
  description = "Old endpapers and wallpapers"
  wikidata = true
  debug = true
  schemaPerson = "https://christianmahnke.de/person.jsonld"
  favicon_32 = "/images/favicon-32.png"
  favicon_16 = "/images/favicon-16.png"

  [params.preview]
    outputPrefix = "ogPreview"
    outputSuffix = ".png"
    format =  "svg"
    image = "front.jpg"
    source = "overlay"
    [params.preview.size]
      height = 630
      width = 1200
    [params.preview.svg]
      template = "./Source Files/Other/preview-template.svg"
      removeMissing = true

[params.author]
  email = 'mail@christianmahnke.de'
  name = 'Christian Mahnke'
  uri = 'http://www.wikidata.org/entity/Q137668638'
